services:
  crypto-dashboard:
    image: mark-crypto-dashboard:20260905T095230Z
    container_name: crypto-dashboard
    restart: unless-stopped
    env_file:
      - /srv/mark-v2/secrets/crypto-dashboard.env
    environment:
      OPENVIKING_BASE_URL: http://openviking:1933
      OPENVIKING_API_KEY_FILE: /run/secrets/openviking-dashboard-key
      OPENVIKING_ACCOUNT: mark-gerhart
      OPENVIKING_USER: hermes
      INTELLIGENCE_AUTO_REFRESH_HOURS: "24"
      SATOSHI_DASHBOARD_SYNC_SECRET_FILE: /run/secrets/satoshi-dashboard-sync-key
      AUTH_MODE: shared-password
      AUTH_USERNAME: mark
      AUTH_ACTOR: mark
      AUTH_PASSWORD_HASH_FILE: /run/secrets/crypto-dashboard-login-password
      AUTH_SESSION_SECRET_FILE: /run/secrets/crypto-dashboard-session-secret
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/crypto-dashboard-turnstile-secret
    ports:
      - "127.0.0.1:9330:5183"
    volumes:
      - /srv/mark-v2/crypto-dashboard/data:/data
      - /srv/mark-v2/crypto-legacy-media/v1:/media:ro
      - /srv/mark-v2/secrets/forkedbrain-hermes-password:/run/secrets/hermes-dashboard-password:ro
      - /srv/mark-v2/secrets/crypto-dashboard-openviking-key:/run/secrets/openviking-dashboard-key:ro
      - /srv/mark-v2/secrets/satoshi-dashboard-sync-key:/run/secrets/satoshi-dashboard-sync-key:ro
      - /srv/mark-v2/secrets/crypto-dashboard-login-password:/run/secrets/crypto-dashboard-login-password:ro
      - /srv/mark-v2/secrets/crypto-dashboard-session-secret:/run/secrets/crypto-dashboard-session-secret:ro
      - /srv/mark-v2/secrets/crypto-dashboard-turnstile-secret:/run/secrets/crypto-dashboard-turnstile-secret:ro
    networks:
      - personal-ai
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  crypto-auth:
    image: caddy:2.10.2-alpine
    container_name: crypto-auth
    restart: unless-stopped
    user: "65532:65532"
    depends_on:
      - crypto-dashboard
    entrypoint:
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        cp /usr/bin/caddy /tmp/caddy
        exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "127.0.0.1:9331:8080"
    volumes:
      - /srv/mark-v2/crypto-dashboard/auth/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - personal-ai
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=96m,mode=1777
      - /config:rw,noexec,nosuid,nodev,size=4m,mode=700,uid=65532,gid=65532
      - /data:rw,noexec,nosuid,nodev,size=4m,mode=700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

networks:
  personal-ai:
    external: true
    name: 27am3wgv7vkohkenprml4s3p
