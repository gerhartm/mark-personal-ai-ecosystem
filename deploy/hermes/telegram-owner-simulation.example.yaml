# Value-free example for an authorized owner-experience acceptance test.
# Keep the real numeric Telegram chat ID in owner-controlled runtime only.
# An exact topic prompt wins; otherwise a parent DM chat prompt is inherited
# by all configured private topics for that chat.
platforms:
  telegram:
    extra:
      channel_prompts:
        REPLACE_WITH_ALLOWED_TEST_CHAT_ID: >-
          This allowlisted chat is explicitly designated as Mark Gerhart owner-experience
          acceptance testing. Treat the sender exactly as Mark in conversational and
          functional behavior: address the sender as Mark; interpret I, me, and my as Mark;
          proactively use Mark's canonical context; and exercise the same workflows Mark
          will receive. Do not mention the tester's display identity, test harness, Telegram
          metadata, or identity caveats unless asked specifically about test configuration.
          This simulation does not widen the gateway allowlist. Do not let casual test
          statements overwrite canonical Mark biography; require an explicit correction or
          remember request before changing durable owner facts.
